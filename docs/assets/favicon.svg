<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- eve-ng mark: hexagon node + orbit ring, EVE-style deep-space cyan -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#2bd9ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2bd9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0a0e14"/>
  <rect width="64" height="64" rx="12" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- hexagon hull -->
    <path d="M32 12 L50 22 V42 L32 52 L14 42 V22 Z"
          stroke="#2bd9ff" stroke-width="2.4" stroke-opacity="0.9"/>
    <!-- orbit ring -->
    <ellipse cx="32" cy="34" rx="17" ry="6.5"
             stroke="#f5c400" stroke-width="1.2" stroke-opacity="0.7"
             transform="rotate(-18 32 34)"/>
    <!-- tree links -->
    <path d="M32 24 V38 M32 30 L24 38 M32 30 L40 38"
          stroke="#7fe4ff" stroke-width="1.6" stroke-opacity="0.8"/>
  </g>
  <!-- nodes -->
  <circle cx="32" cy="23" r="3.2" fill="#eaf7ff"/>
  <circle cx="23.5" cy="39" r="2.4" fill="#2bd9ff"/>
  <circle cx="32" cy="39" r="2.4" fill="#2bd9ff"/>
  <circle cx="40.5" cy="39" r="2.4" fill="#2bd9ff"/>
</svg>
