<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>eve-proxy-ng · 语义视图</title>
<style>
  :root {
    --bg: #0a0e14; --panel: #10161f; --border: #1b2532;
    --cyan: #2bd9ff; --gold: #f5c400; --red: #ff5f56; --green: #52d273;
    --text: #d3dde8; --dim: #77879a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font: 13px/1.5 "Inter", "Microsoft YaHei", sans-serif; overflow: hidden;
         display: flex; flex-direction: row; height: 100vh; }
  #main { display: flex; flex-direction: column; flex: 1; min-width: 0; height: 100vh; }
  header { display: flex; align-items: center; gap: 14px; padding: 6px 14px;
           background: linear-gradient(180deg,#0c141d,#0a0e14);
           box-shadow: inset 0 -2px 0 var(--cyan); flex: none; }
  header h1 { font-size: 15px; letter-spacing: .06em; color: #eaf7ff; }
  header h1 b { color: var(--cyan); }
  #stats { color: var(--dim); font-size: 12px; }
  #stats b { color: var(--text); font-weight: 600; }
  #err { color: var(--red); }
  header .grow { flex: 1; }
  label.tog { color: var(--dim); cursor: pointer; user-select: none;
              font-size: 12px; padding: 2px 6px; border: 1px solid var(--border);
              border-radius: 3px; }
  label.tog.on { color: #7fe4ff; border-color: #2bd9ff66; background: #2bd9ff14; }
  #stage { flex: 1; overflow: auto; position: relative; background: var(--bg); }
  canvas { display: block; transform-origin: 0 0; }
  #tip { position: fixed; pointer-events: none; display: none; max-width: 380px;
         background: #0d141dee; border: 1px solid #2bd9ff55; border-radius: 4px;
         padding: 8px 10px; font-size: 12px; z-index: 10; box-shadow: 0 4px 18px #000c; }
  #tip .t { color: #7fe4ff; font-weight: 600; margin-bottom: 4px; }
  /* 右侧语义结构树面板 */
  #treePanel { width: 380px; flex: none; border-left: 1px solid var(--border);
               display: flex; flex-direction: column; height: 100vh;
               background: #0b1016; }
  #treePanel header { padding: 8px 12px; font-family: Rajdhani, sans-serif;
                      font-weight: 600; letter-spacing: .06em; color: #eaf7ff;
                      border-bottom: 1px solid var(--border);
                      box-shadow: inset 0 -1px 0 #2bd9ff55; flex: none; }
  #treePanel header span { color: var(--dim); font-weight: 400; font-size: 11px; }
  #treeBody { overflow: auto; flex: 1; padding: 4px 0 24px; }
  .tnode { user-select: none; }
  .trow { display: flex; align-items: baseline; gap: 6px; padding: 2px 10px 2px 8px;
          cursor: pointer; border-left: 2px solid transparent; white-space: nowrap; }
  .trow:hover { background: #101823; }
  .trow.active { background: #12303c; border-left-color: var(--cyan); }
  .trow .lbl { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .trow .sub { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .trow .tw { color: #4a5a6c; padding-right: 4px; display: inline-block; width: 14px;
              text-align: center; font-size: 10px; }
  .tkids { margin-left: 14px; border-left: 1px solid #16202d; }
  #jsonViewer { position: fixed; right: 396px; top: 60px; bottom: 12px; width: 460px;
                background: #0d141dee; border: 1px solid #2bd9ff55; border-radius: 4px;
                display: none; z-index: 20; flex-direction: column;
                box-shadow: -6px 6px 24px #000c; }
  #jsonViewer header { padding: 6px 10px; color: #7fe4ff; font-family: Rajdhani, sans-serif;
                       border-bottom: 1px solid #1b2532; display: flex; }
  #jsonViewer header b { flex: 1; }
  #jsonViewer pre { flex: 1; overflow: auto; margin: 0; padding: 10px;
                    font: 11px/1.5 Consolas, monospace; color: #c9e3f5; }
  #jsonViewer .x { cursor: pointer; color: var(--dim); padding: 0 6px; }
  #jsonViewer .x:hover { color: var(--cyan); }
  #tip table { border-collapse: collapse; }
  #tip td { padding: 0 8px 0 0; color: var(--dim); vertical-align: top; }
  #tip td.v { color: var(--text); }
</style>
</head>
<body>
<div id="main">
<header>
  <h1><b>eve-proxy-ng</b> 语义视图</h1>
  <span id="stats">连接中…</span>
  <span id="err"></span>
  <span class="grow"></span>
  <label class="tog" data-k="windows">窗口</label>
  <label class="tog" data-k="overview">总览</label>
  <label class="tog" data-k="modules">模块</label>
  <label class="tog" data-k="menus">菜单</label>
  <label class="tog" data-k="elements">交互元素</label>
  <label class="tog" id="pause">暂停</label>
</header>
<div id="stage"><canvas id="cv"></canvas></div>
</div>
<aside id="treePanel">
  <header>语义结构树 <span id="treeMeta">—</span></header>
  <div id="treeBody"></div>
</aside>
<div id="jsonViewer"><header><b id="jsonPath">snapshot</b><span class="x" id="jsonClose">✕</span></header><pre id="jsonPre"></pre></div>
<div id="tip"></div>
<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const tip = document.getElementById("tip"), statsEl = document.getElementById("stats");
const errEl = document.getElementById("err");
let scene = null, paused = false, updates = 0, lastT = 0, ups = 0;
let nodes = [], scale = 1;
const icons = new Map();  // path -> {img, ok}
const layers = { windows: true, overview: true, modules: true, menus: true, elements: true };

const KIND_OF = {
  window: "windows", tab: "windows", charslot: "windows",
  overview: "overview", item: "overview",
  module: "modules", menu: "menus", menuitem: "menus",
  hud: "modules", element: "elements", neocom: "elements",
};
const COLORS = {
  cyan: "#2bd9ff", gold: "#f5c400", red: "#ff5f56", green: "#52d273",
  dim: "#77879a", text: "#d3dde8", border: "#1b2532", panel: "#10161f",
  row: "#0d141d",
};

function icon(path) {
  if (!path) return null;
  let e = icons.get(path);
  if (!e) {
    const img = new Image();
    e = { img, ok: false };
    img.onload = () => { e.ok = true; requestDraw(); };
    img.src = "/icon?path=" + encodeURIComponent(path);
    icons.set(path, e);
  }
  return e.ok ? e.img : null;
}

function fit() {
  if (!scene) return;
  cv.width = scene.size[0]; cv.height = scene.size[1];
  const stage = document.getElementById("stage");
  scale = Math.min(1, (stage.clientWidth - 12) / cv.width);
  cv.style.transform = `scale(${scale})`;
  cv.style.width = cv.width + "px"; cv.style.height = cv.height + "px";
}
window.addEventListener("resize", () => { fit(); requestDraw(); });

function requestDraw() { requestAnimationFrame(draw); }

// --- occlusion: node rect minus its occluder rects (occluded_by) ---
function subtractOcc(rects, ox, oy, ow, oh) {
  const next = [];
  for (const [x, y, w, h] of rects) {
    const l = Math.max(x, ox), t = Math.max(y, oy);
    const r = Math.min(x + w, ox + ow), b = Math.min(y + h, oy + oh);
    if (r <= l || b <= t) { next.push([x, y, w, h]); continue; }
    if (t > y) next.push([x, y, w, t - y]);
    if (b < y + h) next.push([x, b, w, y + h - b]);
    const mt = Math.max(y, t), mb = Math.min(y + h, b);
    if (l > x) next.push([x, mt, l - x, mb - mt]);
    if (r < x + w) next.push([r, mt, x + w - r, mb - mt]);
  }
  return next;
}
function visibleRects(n) {
  if (!n.occ || !n.occ.length) {
    if (!n.clip) return [[n.x, n.y, n.w, n.h]];
    const r = intersect([n.x, n.y, n.w, n.h], n.clip);
    return r ? [r] : [];
  }
  let rects = [[n.x, n.y, n.w, n.h]];
  if (n.clip) {
    rects = rects.flatMap(r => { const x = intersect(r, n.clip); return x ? [x] : []; });
  }
  for (const [ox, oy, ow, oh] of n.occ) {
    rects = subtractOcc(rects, ox, oy, ow, oh);
    if (!rects.length) break;
    if (rects.length > 32) break;  // pathological fragmentation cap
  }
  return rects;
}
function intersect(a, c) {
  const l = Math.max(a[0], c[0]), t = Math.max(a[1], c[1]);
  const r = Math.min(a[0] + a[2], c[0] + c[2]), b = Math.min(a[1] + a[3], c[1] + c[3]);
  if (r <= l || b <= t) return null;
  return [l, t, r - l, b - t];
}
function outsideClip(n, mx, my) {
  if (!n.clip) return false;
  const [cx, cy, cw, ch] = n.clip;
  return !(mx >= cx && mx < cx + cw && my >= cy && my < cy + ch);
}
function occludedAt(n, mx, my) {
  for (const [x, y, w, h] of (n.occ || [])) {
    if (mx >= x && mx <= x + w && my >= y && my <= y + h) return true;
  }
  return false;
}

function text(s, x, y, color, font, align) {
  ctx.fillStyle = color || COLORS.text;
  ctx.font = font || '12px "Microsoft YaHei", sans-serif';
  ctx.textAlign = align || "left"; ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}
function clipText(s, w) {
  if (!s) return s;
  if (ctx.measureText(s).width <= w) return s;
  while (s.length > 1 && ctx.measureText(s + "…").width > w) s = s.slice(0, -1);
  return s + "…";
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = "#070a0f"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!scene || scene.error) {
    text(scene && scene.error ? "⚠ " + scene.error : "等待场景…",
         cv.width / 2, 40, COLORS.red, '14px "Microsoft YaHei"', "center");
    return;
  }
  if (hoverTree) {
    let rect = hoverTree.rect;
    if (!rect && hoverTree.address) {
      const n = nodes.find(n => (n.d || {}).address === hoverTree.address);
      if (n) rect = [n.x, n.y, n.w, n.h];
    }
    if (rect) {
      ctx.save();
      ctx.strokeStyle = COLORS.gold; ctx.lineWidth = 3;
      ctx.shadowColor = COLORS.gold; ctx.shadowBlur = 12;
      ctx.strokeRect(rect[0] - 2, rect[1] - 2, rect[2] + 4, rect[3] + 4);
      ctx.restore();
    }
  }
  const order = ["element", "neocom", "charslot", "window", "tab",
                 "item", "menuitem", "menu", "overview", "hud", "module"];
  for (const kind of order) {
    for (const n of nodes) {
      if (n.k !== kind || !layers[KIND_OF[kind]]) continue;
      const vis = visibleRects(n);
      if (!vis.length) continue;  // fully occluded — only foreground shows
      if (vis.length === 1 && !n.occ) { drawNode(n); continue; }
      for (const [vx, vy, vw, vh] of vis) {
        ctx.save();
        ctx.beginPath(); ctx.rect(vx, vy, vw, vh); ctx.clip();
        drawNode(n);
        ctx.restore();
      }
    }
  }
}

function drawNode(n) {
  const { x, y, w, h } = n;
  if (w <= 0 || h <= 0) return;
  switch (n.k) {
    case "window":
      ctx.strokeStyle = COLORS.border; ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      if (n.l) {
        ctx.fillStyle = COLORS.panel; ctx.fillRect(x, y, w, 20);
        ctx.strokeStyle = COLORS.border; ctx.strokeRect(x, y, w, 20);
        text(clipText(n.l, w - 12), x + 8, y + 10, "#7fe4ff");
      }
      break;
    case "overview": {
      ctx.fillStyle = COLORS.row; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = n.c === 2 ? COLORS.red + "55" : COLORS.border;
      ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      let tx = x + 6;
      const img = icon(n.i);
      if (img) { ctx.drawImage(img, x + 6, y + (h - 16) / 2, 16, 16); tx += 22; }
      else if (n.i) { ctx.strokeStyle = COLORS.dim; ctx.strokeRect(x + 6, y + (h-16)/2, 16, 16); tx += 22; }
      text(clipText(n.l || "?", w * 0.55), tx, y + h / 2);
      if (n.s) text(n.s, x + w - 8, y + h / 2, COLORS.gold, null, "right");
      break;
    }
    case "item":
      ctx.fillStyle = COLORS.row; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = COLORS.border; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      text(clipText(n.l || "?", w - 60), x + 8, y + h / 2);
      if (n.s) text(n.s, x + w - 8, y + h / 2, COLORS.dim, null, "right");
      break;
    case "menu":
      ctx.fillStyle = "#0e151e"; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "#2bd9ff44"; ctx.lineWidth = 1;
      ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      break;
    case "menuitem":
      text(clipText(n.l || "", w - 8), x + 10, y + h / 2,
           n.c === 1 ? COLORS.text : COLORS.dim);
      break;
    case "module": {
      const d = n.d || {};
      ctx.fillStyle = COLORS.panel;
      ctx.fillRect(x, y, w, h);
      let border = COLORS.border;
      if (d.is_active) border = COLORS.green;
      else if (d.is_busy) border = COLORS.gold;
      ctx.strokeStyle = border; ctx.lineWidth = d.is_active ? 2 : 1;
      ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      const img = icon(n.i);
      if (img) {
        const s = Math.min(w, h) - 8;
        ctx.drawImage(img, x + (w - s) / 2, y + (h - s) / 2, s, s);
      } else if (n.l) {
        text(clipText(n.l.slice(0, 4), w - 4), x + w / 2, y + h / 2,
             COLORS.dim, null, "center");
      }
      if (d.is_active) { ctx.fillStyle = COLORS.green; ctx.fillRect(x + 2, y + 2, 4, 4); }
      break;
    }
    case "hud": {
      const d = n.d || {};
      const bars = [
        ["电容", d.capacitor_percent, COLORS.cyan],
        ["护盾", d.shield, "#52d2c9"],
        ["装甲", d.armor, "#e8b04a"],
        ["结构", d.structure, "#e06c5a"],
      ];
      let by = y - 4 - bars.length * 14;
      const bx = x + w - 150;
      for (const [name, pct, color] of bars) {
        if (pct == null) continue;
        by += 14;
        ctx.fillStyle = "#0d141d"; ctx.fillRect(bx, by, 120, 8);
        ctx.fillStyle = color; ctx.fillRect(bx, by, 120 * Math.max(0, Math.min(100, pct)) / 100, 8);
        text(name, bx - 6, by + 4, COLORS.dim, '10px sans-serif', "right");
      }
      if (d.speed_text) text(d.speed_text, bx - 6, by + 18, COLORS.gold, null, "right");
      break;
    }
    case "tab": {
      const selected = n.c === 1;
      ctx.strokeStyle = selected ? COLORS.cyan + "aa" : COLORS.border;
      ctx.lineWidth = selected ? 2 : 1;
      ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      if (selected) {
        ctx.fillStyle = COLORS.cyan;
        ctx.fillRect(x + 1, y + h - 3, w - 2, 2);
        ctx.fillStyle = "#2bd9ff18";
        ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
      }
      text(clipText(n.l || "", w - 6), x + w / 2, y + h / 2,
           selected ? "#d6f6ff" : COLORS.dim, null, "center");
      break;
    }
    case "charslot": {
      ctx.fillStyle = "#0e151e";
      ctx.fillRect(x, y, w, h);
      const occl = ((n.d || {}).occluded_percent) || 0;
      ctx.strokeStyle = occl > 0 ? COLORS.red + "66" : COLORS.cyan + "55";
      ctx.lineWidth = occl > 0 ? 1 : 2;
      ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      text(clipText(n.l || "(未知名)", w - 16), x + 10, y + 22,
           "#eaf7ff", 'bold 16px "Microsoft YaHei"');
      if (n.s) {
        text(clipText(n.s, w - 16), x + 10, y + 42, COLORS.dim,
             '11px "Microsoft YaHei"');
      }
      text("角色", x + w - 8, y + 14, COLORS.cyan + "88",
           '10px "Microsoft YaHei"', "right");
      break;
    }
    case "neocom": {
      ctx.fillStyle = COLORS.panel;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = n.c === 1 ? COLORS.cyan + "77" : COLORS.border;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      const img = icon(n.i);
      if (img) {
        const s = Math.min(w, h) - 22;
        ctx.drawImage(img, x + (w - s) / 2, y + (h - s) / 2 - 4, s, s);
      } else {
        ctx.strokeStyle = COLORS.dim + "66";
        ctx.strokeRect(x + w / 2 - 12, y + h / 2 - 16, 24, 24);
      }
      if (n.l) text(clipText(n.l, w - 6), x + w / 2, y + h - 9,
                    "#9fe8ff", '10px "Microsoft YaHei"', "center");
      break;
    }
    default: {  // element
      const stroke = n.c === 1 ? COLORS.cyan + "66"
                   : n.c === 2 ? COLORS.red + "44" : COLORS.dim + "33";
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1;
      if (n.c === 0) ctx.setLineDash([3, 3]);
      ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      ctx.setLineDash([]);
      const img = icon(n.i);
      let tx = x + 4;
      if (img) {
        const s = Math.min(16, h - 4, w / 3);
        if (s >= 8) { ctx.drawImage(img, x + 4, y + h / 2 - s / 2, s, s); tx = x + 8 + s; }
      }
      if (n.l && h >= 14 && w >= 30) {
        text(clipText(n.l, x + w - tx - 6), tx, y + h / 2,
             n.c === 1 ? "#9fe8ff" : COLORS.dim, '10px "Microsoft YaHei"');
      }
      break;
    }
  }
}

function applyScene(next) {
  scene = next;
  nodes = next.nodes || [];
  tree.items = next.tree || [];
  treeMeta.textContent = (next.stats && next.stats.node_count)
    ? `节点 ${next.stats.node_count}` : "";
  renderTree(tree.items);
  fit();
  requestDraw();
}

const es = new EventSource("/stream");
es.onmessage = (ev) => {
  errEl.textContent = "";
  if (paused) { updates++; return; }
  applyScene(JSON.parse(ev.data));
  updates++;
  const now = performance.now();
  if (now - lastT > 1000) { ups = Math.round(updates * 1000 / (now - lastT)); updates = 0; lastT = now; }
  const s = scene.stats || {}, st = scene.state || {};
  statsEl.innerHTML =
    `状态 <b>${st.screen || "?"}${st.modal ? " · 模态:" + st.modal : ""}</b>` +
    ` · 节点 <b>${s.node_count ?? "?"}</b> · 绘制 <b>${s.nodes ?? "?"}</b>` +
    (s.build_ms != null ? ` · 构建 <b>${s.build_ms}ms</b>` : "") +
    ` · <b>${ups}/s</b>`;
};
es.onerror = () => { errEl.textContent = "SSE 断开，重连中…"; };

document.querySelectorAll("label.tog[data-k]").forEach(el => {
  el.classList.add("on");
  el.onclick = () => {
    const k = el.dataset.k;
    layers[k] = !layers[k];
    el.classList.toggle("on", layers[k]);
    requestDraw();
  };
});
const pauseEl = document.getElementById("pause");
pauseEl.onclick = () => {
  paused = !paused;
  pauseEl.classList.toggle("on", paused);
  pauseEl.textContent = paused ? "继续" : "暂停";
};

cv.addEventListener("mousemove", (ev) => {
  const r = cv.getBoundingClientRect();
  const mx = (ev.clientX - r.left) / scale, my = (ev.clientY - r.top) / scale;
  let hit = null;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (mx >= n.x && mx <= n.x + n.w && my >= n.y && my <= n.y + n.h
        && !occludedAt(n, mx, my) && !outsideClip(n, mx, my)) { hit = n; break; }
  }
  if (!hit) { tip.style.display = "none"; setTreeActive(null); return; }
  setTreeActive((hit.d || {}).address || null);
  const d = hit.d || {};
  const rows = [
    ["类型", d.type_name || hit.k],
    hit.l && ["标签", hit.l],
    d.name && ["名称", d.name],
    d.role && ["角色", d.role],
    d.hint && ["提示", d.hint],
    hit.s && ["副标", hit.s],
    d.icon_name && ["图标名", d.icon_name],
    d.type_id && ["typeID", d.type_id],
    d.address && ["地址", d.address],
    d.occluded_percent != null && ["遮挡", d.occluded_percent + "%"],
    d.is_active != null && ["激活", d.is_active ? "是" : "否"],
    hit.i && ["图标", hit.i],
  ].filter(Boolean);
  tip.innerHTML = `<div class="t">${hit.k}</div><table>` +
    rows.map(([k, v]) => `<tr><td>${k}</td><td class="v">${String(v).replace(/</g, "&lt;")}</td></tr>`).join("") +
    "</table>";
  tip.style.display = "block";
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - 400) + "px";
  tip.style.top = Math.min(ev.clientY + 14, innerHeight - 140) + "px";
});
cv.addEventListener("mouseleave", () => { tip.style.display = "none"; setTreeActive(null); });

// ---------------- semantic structure tree (right panel) ----------------
const treeBody = document.getElementById("treeBody");
const treeMeta = document.getElementById("treeMeta");
const jsonViewer = document.getElementById("jsonViewer");
const jsonPre = document.getElementById("jsonPre");
const jsonPath = document.getElementById("jsonPath");
const openState = new Map();      // label-path -> open
let rowByAddress = new Map();     // address -> row element
let hoverTree = null;             // {rect, address} 画布高亮

document.getElementById("jsonClose").onclick = () => { jsonViewer.style.display = "none"; };

function nodeKey(item, prefix) { return prefix + "/" + (item.l || "?"); }

function renderTree(items) {
  const top = treeBody.scrollTop;
  treeBody.innerHTML = "";
  rowByAddress = new Map();
  const frag = document.createDocumentFragment();
  for (const item of items) frag.appendChild(buildBranch(item, "", 0));
  treeBody.appendChild(frag);
  treeBody.scrollTop = top;
}

function buildBranch(item, prefix, depth) {
  const wrap = document.createElement("div");
  wrap.className = "tnode";
  const row = document.createElement("div");
  row.className = "trow";
  const kids = item.c || [];
  const tw = document.createElement("span");
  tw.className = "tw";
  tw.textContent = kids.length ? (openState.get(nodeKey(item, prefix)) ? "▾" : "▸") : "";
  row.appendChild(tw);
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  lbl.textContent = item.l || "?";
  lbl.style.color = depth === 0 ? "#7fe4ff" : "";
  row.appendChild(lbl);
  if (item.s) {
    const sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = item.s;
    row.appendChild(sub);
  }
  wrap.appendChild(row);
  if (item.a && rowByAddress && !rowByAddress.has(item.a)) rowByAddress.set(item.a, row);
  const key = nodeKey(item, prefix);
  row.onmouseenter = () => {
    hoverTree = item.r ? { rect: item.r } : (item.a ? { address: item.a } : null);
    requestDraw();
  };
  row.onmouseleave = () => { hoverTree = null; requestDraw(); };
  row.onclick = async (ev) => {
    if (kids.length && (ev.target === tw || ev.target === lbl)) {
      openState.set(key, !openState.get(key));
      renderTree(tree.items);
      return;
    }
    if (item.p) await showJson(item.p);
  };
  tw.onclick = (ev) => { ev.stopPropagation(); openState.set(key, !openState.get(key)); renderTree(tree.items); };
  if (kids.length) {
    const open = openState.get(key) ?? depth < 1;
    if (open) {
      const box = document.createElement("div");
      box.className = "tkids";
      for (const kid of kids) box.appendChild(buildBranch(kid, key, depth + 1));
      wrap.appendChild(box);
    }
  }
  return wrap;
}

async function showJson(path) {
  try {
    const res = await fetch("/snapshot?path=" + encodeURIComponent(path.join(",")));
    const text = await res.text();
    jsonPath.textContent = "snapshot." + path.join(".");
    jsonPre.textContent = text;
    jsonViewer.style.display = "flex";
  } catch (e) { jsonPre.textContent = String(e); jsonViewer.style.display = "flex"; }
}

function setTreeActive(address) {
  document.querySelectorAll(".trow.active").forEach(el => el.classList.remove("active"));
  if (!address) return;
  const row = rowByAddress.get(address);
  if (row) {
    row.classList.add("active");
    row.scrollIntoView({ block: "nearest" });
  }
}

// 画布 hover → 树联动（现有 mousemove 已找到 hit 节点）
const _origMove = cv.onmousemove;
cv.addEventListener("mousemove", () => {}, { passive: true });
// 在 applyScene 中同步树
let tree = { items: [] };
</script>
